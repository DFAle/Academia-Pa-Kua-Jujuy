<br><br><br>
<div class="container reg-wrap">
  <div class="reg-card">
    <!-- Panel lateral -->
    <aside class="reg-side">
      <div class="side-contenido">
        <div class="side-logo">
          <img src="logo-pakua.png" alt="Pa-Kua Liga Internacional Central Jujuy">
        </div>
        <span class="side-etiqueta"><i class="bi bi-person-plus-fill me-1"></i>Nuevo ingreso</span>
        <h2 class="side-titulo">Registrar<br>Alumno</h2>
        <p class="side-texto">
          Sumá un nuevo alumno a la academia, asignale su profesor y su método de pago.
        </p>

        <ul class="side-pasos">
          <li><span><i class="bi bi-person"></i></span> Datos personales</li>
          <li><span><i class="bi bi-envelope"></i></span> Contacto y ubicación</li>
          <li><span><i class="bi bi-award"></i></span> Profesor y pago</li>
        </ul>
      </div>

      <div class="side-pie">Método Pa-Kua · Gestión de academia</div>
    </aside>

    <!-- Formulario -->
    <form class="reg-form">

      <!-- DATOS PERSONALES -->
      <h5 class="form-grupo"><i class="bi bi-person-vcard"></i> Datos personales</h5>
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <div class="form-floating">
            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre" required>
            <label for="nombre">Nombre</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-floating">
            <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Apellido" required>
            <label for="apellido">Apellido</label>
          </div>
        </div>
        <div class="col-md-5">
          <div class="form-floating">
            <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" placeholder="Fecha de nacimiento" required>
            <label for="fechaNacimiento">Fecha de nacimiento</label>
          </div>
        </div>
        <div class="col-md-3">
          <div class="form-floating">
            <input type="number" min="0" max="120" class="form-control" id="edad" name="edad" placeholder="Edad" required>
            <label for="edad">Edad</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-floating">
            <input type="text" inputmode="numeric" class="form-control" id="documento" name="documento" placeholder="Documento" required>
            <label for="documento">Documento</label>
          </div>
        </div>
      </div>

      <!-- CONTACTO Y UBICACIÓN -->
      <h5 class="form-grupo"><i class="bi bi-chat-dots"></i> Contacto y ubicación</h5>
      <div class="row g-2 mb-3">
        <div class="col-md-5">
          <div class="form-floating">
            <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Teléfono" required>
            <label for="telefono">Teléfono</label>
          </div>
        </div>
        <div class="col-md-7">
          <div class="form-floating">
            <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
            <label for="email">Email</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-floating">
            <input type="text" class="form-control" id="pais" name="pais" placeholder="País" required>
            <label for="pais">País</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-floating">
            <input type="text" class="form-control" id="provincia" name="provincia" placeholder="Provincia" required>
            <label for="provincia">Provincia</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-floating">
            <input type="text" class="form-control" id="ciudad" name="ciudad" placeholder="Ciudad" required>
            <label for="ciudad">Ciudad</label>
          </div>
        </div>
        <div class="col-12">
          <div class="form-floating">
            <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Dirección" required>
            <label for="direccion">Dirección (domicilio)</label>
          </div>
        </div>
      </div>
       <!-- CLASE, PROFESOR Y PAGO -->
      <h5 class="form-grupo"><i class="bi bi-award"></i> Clase</h5>

      <div class="chips mb-3">
        <input type="radio" class="btn-check" name="clase" id="c1" value="arte-marcial" required>
        <label class="chip" for="c1">Arte Marcial</label>

        <input type="radio" class="btn-check" name="clase" id="c2" value="arqueria">
        <label class="chip" for="c2">Arquería</label>

        <input type="radio" class="btn-check" name="clase" id="c3" value="acrobacia">
        <label class="chip" for="c3">Acrobacia</label>

        <input type="radio" class="btn-check" name="clase" id="c4" value="armas-de-corte">
        <label class="chip" for="c4">Armas de corte</label>

        <input type="radio" class="btn-check" name="clase" id="c5" value="pa-kua-ritmo">
        <label class="chip" for="c5">Pa-Kua Ritmo</label>

        <input type="radio" class="btn-check" name="clase" id="c6" value="pa-kua-chi">
        <label class="chip" for="c6">Pa-Kua Chi</label>

        <input type="radio" class="btn-check" name="clase" id="c7" value="sintonia-yoga-chino">
        <label class="chip" for="c7">Sintonía Yoga chino</label>

        <input type="radio" class="btn-check" name="clase" id="c8" value="cosmodinamia-tai-chi">
        <label class="chip" for="c8">Cosmodinamia Tai-Chi</label>
      </div>
      <!-- PROFESOR Y PAGO -->
      <h5 class="form-grupo"><i class="bi bi-award"></i> Profesor</h5>
      <div class="form-floating mb-2">
        <select class="form-select" id="profesor" name="profesor" required>
          <option value="" selected disabled>Seleccionar profesor...</option>
          <!-- Reemplazá por tus profesores -->
          <option value="1">Pérez, Juan — Arte Marcial</option>
          <option value="2">Gómez, Ana — Pa-Kua Chi</option>
        </select>
        <label for="profesor">Profesor a cargo</label>
      </div>

      <p class="chips-label">Método de pago</p>
      <div class="chips chips-pago mb-3">
        <input type="radio" class="btn-check" name="metodoPago" id="p1" value="qr" required>
        <label class="chip" for="p1">QR <small class="chip-pct">-2.2%</small></label>

        <input type="radio" class="btn-check" name="metodoPago" id="p2" value="tarjeta-credito">
        <label class="chip" for="p2">Tarjeta de Crédito <small class="chip-pct">-2.5%</small></label>

        <input type="radio" class="btn-check" name="metodoPago" id="p3" value="debito-automatico">
        <label class="chip" for="p3">Tarjeta de Débito Automático <small class="chip-pct">-1.5%</small></label>

        <input type="radio" class="btn-check" name="metodoPago" id="p4" value="transferencia">
        <label class="chip" for="p4">Transferencia <small class="chip-pct">-0%</small></label>

        <input type="radio" class="btn-check" name="metodoPago" id="p5" value="efectivo">
        <label class="chip" for="p5">Efectivo <small class="chip-pct">-0%</small></label>
      </div>

      <div class="reg-acciones">
        <button type="button" class="btn btn-cancelar" (click)="volverTabla()">Cancelar</button>
        <button type="submit" class="btn btn-registrar">
          Guardar alumno <i class="bi bi-arrow-right ms-1"></i>
        </button>
      </div>

    </form>
  </div>
</div>
